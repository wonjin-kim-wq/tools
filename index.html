<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참코딩</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#eceef1; --line2:#dfe2e7;
  --ink:#191f28; --sub:#6b7684; --mute:#8b95a1; --chip:#f2f4f6;
  --yel:#ffd23f;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-h:0 12px 32px rgba(16,24,40,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
/* 스크롤바가 화면 폭을 차지하는 컴퓨터(윈도우 등)에서도 폭이 변하지 않게 자리를 항상 잡아 둔다.
   그러지 않으면 '스크롤바 생김 → 폭 줄어 카드 재배치 → 높이 변해 스크롤바 사라짐'이 반복되며 카드가 위아래로 떨린다. */
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* 왼쪽 사이드바: 앱스토어처럼 메뉴를 한곳에 모은다 */
:root{--side:248px}
body{padding-left:var(--side)}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:6;display:flex;flex-direction:column;gap:16px;padding:22px 14px 16px;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.side .logo{padding:0 6px}
.menu-toggle{display:none}
.side-panel{display:flex;flex-direction:column;flex:1;gap:14px}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side-label{font-size:11.5px;font-weight:700;color:var(--mute);padding:10px 10px 6px}
.side-label:first-child{padding-top:0}
.side-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600;color:#333d4b;transition:background .15s,color .15s}
.side-item .ic{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--chip)}
.side-item small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}
.side-item:hover{background:var(--chip)}
.side-item.on{background:#e8ebf0;color:var(--ink)}
.side-item.on .ic{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.side-item:focus-visible,.menu-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.side-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 38px;padding-left:10px;border-left:2px solid var(--line);animation:side-open .18s ease-out}
.side-sub button{display:flex;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--sub)}
.side-sub button small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}
.side-sub button:hover{background:var(--chip);color:var(--ink)}
.side-sub button.on{background:var(--ink);color:#fff}.side-sub button.on small{color:rgba(255,255,255,.7)}
@keyframes side-open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.side-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.side-foot .btn{width:100%}
.side-foot .buddy-toggle{justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo .mark{width:40px;height:33px;flex:none}
.char{position:relative;display:inline-block}
.char img{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.logo b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.logo small{display:block;font-size:11.5px;color:var(--mute);font-weight:500;margin-top:1px;white-space:nowrap}
.btn{border:0;border-radius:10px;height:38px;padding:0 16px;font-size:14px;font-weight:600;transition:background .15s,color .15s;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--chip);color:var(--ink)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#333d4b}
.buddy-toggle{display:flex;align-items:center;gap:8px}
.buddy-toggle .sw{position:relative;width:30px;height:18px;border-radius:9px;background:#d1d6db;transition:background .2s}
.buddy-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:transform .2s}
.buddy-toggle[aria-pressed="true"] .sw{background:var(--ink)}
.buddy-toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
@media (max-width:640px),(hover:none){.buddy-toggle{display:none}}

/* 제목 + 정렬 */
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 0 18px}
.head h1{font-size:24px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.head .total{font-size:14px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:2px 10px;letter-spacing:0}
/* 교과별 보기: 웹앱 개수 옆 작은 버튼. 여러 교과에 걸친 앱은 해당 교과마다 보인다 */
.head-main{display:flex;align-items:flex-start;gap:14px;min-width:0;flex:1}
.head h1{flex:none;white-space:nowrap}
.subj{display:flex;flex-wrap:wrap;gap:6px;min-width:0;padding:0}
.subj button{flex:none;border:1px solid #e1e4e8;background:#fff;color:var(--sub);height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.subj button small{margin-left:4px;font-size:11px;font-weight:700;opacity:.7}
.subj button:hover{border-color:#c9ced6;color:var(--ink)}
.subj button.on{background:var(--ink);border-color:var(--ink);color:#fff}.subj button.on small{opacity:.85}
.subj button.none:not(.on){opacity:.45}
.head p{font-size:14px;color:var(--sub);margin-top:6px}
.head p b{color:var(--ink);font-weight:600}
.seg{position:relative;display:flex;background:#eaecef;border-radius:12px;padding:4px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;height:34px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub);transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:0;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12);transition:transform .15s ease-out,width .15s}

/* 카드 그리드 */
.grid{position:relative;margin-bottom:56px}
.card{position:absolute;display:flex;align-items:center;gap:4px;padding:0 20px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);cursor:pointer;outline:none;
  transition:box-shadow .25s,border-color .25s,transform .25s}
.grid.ready .card{transition:left .8s cubic-bezier(.65,0,.25,1),top .8s cubic-bezier(.65,0,.25,1),box-shadow .25s,border-color .25s,transform .25s,opacity .3s}
.card.hide{opacity:0;pointer-events:none;transform:scale(.96)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:48px 0 80px}

/* 검색 */
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--chip);border-radius:12px;color:var(--mute);border:1px solid transparent;transition:border-color .15s,background .15s}
.search:focus-within{background:#fff;border-color:var(--ink);color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.side .search{flex:none;max-width:none;height:38px}

/* 홍보 배너: 관리자가 고른 추천 앱, 없으면 인기 1위 */
/* 오른쪽 위: 방문자 수 · 로그인 */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding-top:18px}
.topbar .visit-stats{display:flex;align-items:center;gap:14px;padding:0;margin:0;font-size:12.5px;color:var(--sub)}
.topbar .visit-stats b{margin-left:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.topbar .visit-stats small{width:auto;font-size:12px}
.topbar .btn{height:36px;border-radius:999px;padding:0 18px}
.hero{position:relative;margin-top:14px;height:300px;border-radius:24px;overflow:hidden;background:#222;box-shadow:var(--shadow-h)}
.hero-slide{position:absolute;inset:0;display:flex;align-items:flex-end;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;
  background:linear-gradient(115deg,color-mix(in srgb,var(--c) 55%,#1c1404) 0%,color-mix(in srgb,var(--c) 80%,#2a1e00) 45%,color-mix(in srgb,var(--c) 70%,#fff) 100%)}
.hero-slide.on{opacity:1;visibility:visible}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:58%;display:grid;place-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art .hero-emoji{font-size:120px;transform:rotate(-8deg);filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.hero-copy{position:relative;z-index:1;max-width:520px;padding:32px 36px;color:#fff}
.hero-eyebrow{font-size:12.5px;font-weight:700;opacity:.85}
.hero-copy h2{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.hero-copy>p{font-size:14.5px;line-height:1.6;margin-top:6px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-app{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.25)}
.hero-thumb{width:52px;height:52px;flex:none;border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hero-thumb img{width:100%;height:100%;object-fit:cover}
.hero-app b{display:block;font-size:14.5px}
.hero-app small{display:block;font-size:12px;opacity:.8;margin-top:2px}
.hero-open{margin-left:auto;border:0;border-radius:999px;height:34px;padding:0 20px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.92);color:var(--ink)}
.hero-dots{position:absolute;right:24px;bottom:18px;z-index:2;display:flex;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.18)}
.hero-dots button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.5)}
.hero-dots button.on{background:#fff;width:18px;border-radius:4px}

/* 후기: 가로로 천천히 흘러가며 순환하고, 마우스를 올리면 멈춘다 */
.voices{margin-top:22px}
.voices-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.voices-head h2{font-size:18px;font-weight:700;letter-spacing:-.02em}
.voices-note{font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:6px;padding:2px 7px}
.voices-track{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.voices-row{display:flex;gap:14px;width:max-content;animation:voices 42s linear infinite}
.voices-track:hover .voices-row,.voices-track:focus-within .voices-row{animation-play-state:paused}
@keyframes voices{to{transform:translateX(calc(-50% - 7px))}}
.voice{flex:none;width:300px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.voice p{font-size:14px;line-height:1.65;color:#333d4b}
.voice p::before{content:"“";display:block;font-size:28px;line-height:.8;color:#d1d6db;font-weight:800}
.voice footer{display:flex;align-items:center;gap:10px;margin-top:14px}
.voice .who{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--c)}
.voice b{display:block;font-size:13px}
.voice small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
@media (prefers-reduced-motion:reduce){.voices-row{animation:none!important}.voices-track{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}

/* 목록을 불러오는 동안 보이는 자리 표시 카드 */
.grid-loading{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:56px}
.grid-loading .sk{height:164px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(90deg,#f1f3f5 25%,#f8f9fa 50%,#f1f3f5 75%);background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
@media (max-width:640px){.grid-loading{grid-template-columns:1fr;gap:12px}.grid-loading .sk{height:124px}}

/* 인기순 기간 보기: 위의 정렬 버튼(최신순·인기순·업데이트순)과 같은 크기로 오른쪽에 맞춘다 */
.period{display:flex;background:#eaecef;border-radius:12px;margin:0 0 0 auto;padding:0 4px;max-height:0;opacity:0;overflow:hidden;transform:translateY(-8px);
  transition:max-height .34s cubic-bezier(.2,.8,.2,1),padding .34s cubic-bezier(.2,.8,.2,1),margin .34s cubic-bezier(.2,.8,.2,1),opacity .24s ease-out,transform .34s cubic-bezier(.2,.8,.2,1)}
/* 인기순을 고르면 접혀 있던 버튼이 펼쳐지며 아래로 내려오고, 카드 목록도 함께 자연스럽게 밀려 내려간다 */
.period.show{max-height:50px;padding:4px;margin:-6px 0 16px auto;opacity:1;transform:none}
.period button{flex:1;border:0;background:none;height:34px;padding:0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub);transition:background .15s,color .15s}
.period button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

/* 별점 · 순위 변동 */
.card-rating{display:inline-block;margin:10px 0 0 6px;font-size:12px;font-weight:700;color:#e8a100}
.card-rating small{color:var(--mute);font-weight:500}
.rank-move{position:absolute;right:12px;top:10px;z-index:2;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.rank-move.up{color:#d63c2f;background:#fff0ee}
.rank-move.down{color:#1b64da;background:#e8f1fd}
.rank-move.same{color:var(--mute);background:var(--chip)}
.rank-move.new{color:#1f8a4c;background:#e6f6ec}
.stars{display:inline-flex;gap:1px;font-size:13px;letter-spacing:0}
.stars i{font-style:normal;color:#dfe2e7}.stars i.on{color:#ffb400}
.rating-summary{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.rating-big b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.rating-big small{display:block;font-size:12.5px;color:var(--sub);margin-top:6px;font-weight:600}
.rating-bars{flex:1;display:flex;flex-direction:column;gap:3px}
.rating-bars div{display:flex;align-items:center;gap:8px}
.rating-bars span{width:52px;text-align:right;font-size:8px;letter-spacing:-1px;color:#8b95a1}
.rating-bars i{flex:1;height:4px;border-radius:2px;background:#eceef1;overflow:hidden}
.rating-bars em{display:block;height:100%;background:#4e5968;border-radius:2px}
.rating-bars small{align-self:flex-end;font-size:12px;color:var(--mute);margin-top:4px}
.star-pick{border:0;padding:0;margin:4px 0 8px;display:flex;align-items:center;gap:10px}
.star-row{display:inline-flex;flex-direction:row-reverse;gap:2px}
.star-pick legend{float:left;font-size:13px;font-weight:600;color:#4e5968;margin-right:10px;padding:0;line-height:24px}
.star-pick input{position:absolute;opacity:0;width:1px;height:1px}
.star-pick label{font-size:24px;line-height:1;color:#dfe2e7;cursor:pointer;transition:color .1s}
.star-pick input:checked ~ label,.star-pick label:hover,.star-pick label:hover ~ label{color:#ffb400}
.star-pick input:focus-visible + label{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* 상세 스크린샷 좌우 스크롤 버튼 (마우스가 있는 화면) */
.shots-wrap{position:relative}
.shot-nav{position:absolute;top:50%;z-index:2;width:40px;height:40px;margin-top:-20px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(16,24,40,.14);font-size:18px;color:var(--ink);display:grid;place-items:center;transition:opacity .15s}
.shot-nav.prev{left:12px}.shot-nav.next{right:12px}
.shot-nav:disabled{opacity:0;pointer-events:none}
.shot-nav:hover{background:#fff}
@media (hover:none){.shot-nav{display:none}}

/* 상세: 소개 영상 · 리뷰 · 다른 앱 · 새로운 소식 */
.detail-sec{padding:0 32px 28px}
.detail-sec>h4{display:flex;align-items:baseline;gap:8px;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.detail-sec>h4 small{font-size:13px;color:var(--mute);font-weight:500}
.video-box{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.detail-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:0 8px;border-top:1px solid var(--line);padding-top:24px}
.detail-cols .detail-sec{padding-right:16px}
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{background:var(--bg);border-radius:16px;padding:14px 16px}
.review-item header{display:flex;align-items:center;gap:8px;font-size:13px}
.review-item header b{font-weight:700}
.review-item header time{margin-left:auto;font-size:12px;color:var(--mute)}
.review-item p{font-size:14px;line-height:1.65;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:#333d4b}
.review-item .mine{font-size:11px;font-weight:700;color:#775600;background:#fff1bb;border-radius:6px;padding:1px 6px}
.review-item .hide-review{border:0;background:none;font-size:12px;color:#b43b28;text-decoration:underline;padding:0}
.review-form{margin-top:12px}
.review-form textarea{display:block;width:100%;min-height:76px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none}
.review-form textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(25,31,40,.08)}
.review-form footer{display:flex;align-items:center;gap:8px;margin-top:8px}
.review-form footer small{color:var(--mute);font-size:12px}
.review-form footer .btn{margin-left:auto;height:34px;border-radius:999px}
.muted{font-size:13.5px;color:var(--sub);line-height:1.7}
.more-list{display:flex;flex-direction:column;gap:4px}
.more-app{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:14px}
.more-app:hover{background:var(--bg)}
.more-thumb{width:52px;height:52px;flex:none;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-size:24px;background:var(--c)}
.more-thumb img{width:100%;height:100%;object-fit:cover}
.more-app b{display:block;font-size:14.5px}
.more-app small{display:block;font-size:12px;color:var(--mute);margin-top:2px}

@media (min-width:901px){.wrap>.cats{display:none}}   /* 넓은 화면에서는 사이드바가 카테고리를 맡는다 */
@media (max-width:900px){
  body{padding-left:0}
  .side{position:sticky;top:0;bottom:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 20px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}

  .side .search{order:3;flex-basis:100%}

/* 카테고리 위젯 */
.cats{display:flex;gap:10px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:1 0 auto;min-width:150px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:left;transition:border-color .2s,box-shadow .2s,background .2s,color .2s}
.cat:hover{border-color:var(--line2);box-shadow:var(--shadow-h)}
.cat .ic{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--chip)}
.cat b{display:block;font-size:14.5px;font-weight:700}
.cat small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat.on .ic{background:rgba(255,255,255,.14)}
.cat.on small{color:rgba(255,255,255,.65)}
/* 마우스를 올려도 카드를 움직이지 않는다. 카드 아래쪽 끝에 커서가 있으면 올라감·내려옴이 반복되며 떨리기 때문 */
.card:hover{box-shadow:var(--shadow-h);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pod{position:relative;flex:none;width:126px;height:140px}
.pod::after{content:"";position:absolute;left:50%;top:86px;width:60px;height:14px;margin-left:-30px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(16,24,40,.18),transparent);animation:shade 4.8s ease-in-out infinite;animation-delay:var(--d)}
.scene{position:absolute;left:50%;top:76px;width:0;height:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-45deg)}
.tile{position:absolute;width:56px;height:56px;left:-28px;top:-28px;border-radius:14px;transform-style:preserve-3d;animation:float 4.8s ease-in-out infinite;animation-delay:var(--d)}
.tile i{position:absolute;inset:0;border-radius:inherit;display:block;background:color-mix(in srgb,var(--c) 74%,#1f2937)}
.tile i:last-child{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#fff),var(--c));box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.tile .glyph{font-size:28px;line-height:1;transform:translateZ(2px) rotateZ(45deg) rotateX(-50deg) translateY(-6px)}
@keyframes float{0%,100%{transform:translateZ(22px)}50%{transform:translateZ(30px)}}
@keyframes shade{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.85);opacity:.7}}
.txt{flex:1;min-width:0}
.when{font-size:12px;color:var(--mute);font-weight:500}
.m-cat{display:none}
.txt h2{font-size:16.5px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt p{font-size:13px;color:var(--sub);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:600;color:#4e5968;background:var(--chip);padding:3px 8px;border-radius:6px}

/* 모달 공통 */
.dim{position:fixed;inset:0;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:opacity .12s;z-index:20}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;z-index:21;background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(16,24,40,.18);
  opacity:0;pointer-events:none;transform:translate(-50%,-48%) scale(.98);transition:opacity .12s,transform .14s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;overflow:auto;overscroll-behavior:contain}
.sheet.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
/* 스크롤 막대가 둥근 모서리 밖으로 삐져나오지 않게 위아래를 모서리 반지름만큼 띄우고 얇게 그린다 */
.sheet::-webkit-scrollbar{width:10px}
.sheet::-webkit-scrollbar-track{background:transparent;margin:24px 0}
.sheet::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:999px;border:3px solid #fff}
.sheet::-webkit-scrollbar-thumb:hover{background:#aeb4bd}
.app-sheet{width:min(760px,calc(100% - 48px))}
.auth-sheet{width:min(420px,calc(100% - 48px));padding:36px 32px 28px}
.x{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);font-size:14px;color:var(--sub);z-index:1}
.x:hover{background:#e5e8eb;color:var(--ink)}

/* 앱 상세 */
.hd{display:flex;gap:20px;padding:32px 32px 24px;align-items:center}
.bigicon{width:96px;height:96px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:6px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#fff),var(--c));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 6px 0 color-mix(in srgb,var(--c) 74%,#1f2937),0 14px 24px rgba(16,24,40,.12)}
.hd h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.hd .sub{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.5}
.hd .acts{display:flex;gap:8px;margin-top:14px}
.hd .btn{border-radius:999px;padding:0 22px;height:36px}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.line:hover{background:var(--chip)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:14px 8px;text-align:center;min-width:0}
.facts div+div{border-left:1px solid var(--line)}
.facts span{display:block;font-size:11.5px;color:var(--mute)}
.facts b{display:block;font-size:15px;margin-top:6px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shots{display:flex;gap:12px;overflow-x:auto;padding:24px 32px;scroll-padding-inline:32px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;width:220px;height:390px;border-radius:18px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;scroll-snap-align:start;background:#fafbfc}
.shot .bar{height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:700;font-size:13px}
.shot .body{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.shot .cap{padding:10px 14px;font-size:12px;color:var(--sub);background:#fff;border-top:1px solid var(--line)}
.blk{border-radius:8px;background:#eceef1}
.desc{padding:0 32px 32px;font-size:14.5px;line-height:1.75;color:#333d4b}
.desc h4{font-size:16px;margin:20px 0 8px;color:var(--ink)}
.desc ul{padding-left:18px}

/* 로그인 · 회원가입 */
.auth-sheet .mark{width:64px;height:53px;margin-bottom:14px}
.auth-sheet h3{font-size:22px;font-weight:700;letter-spacing:-.03em}
.auth-sheet .lead{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:4px;margin:22px 0 18px}
.tabs button{flex:1;border:0;background:none;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:#4e5968;margin-bottom:6px}
.field input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(25,31,40,.08)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:4px 0}
.check input{width:16px;height:16px;accent-color:var(--ink)}
.submit{width:100%;height:50px;border-radius:12px;margin-top:10px;font-size:15px}
.soon{font-size:12.5px;color:#7a6000;background:#fff7d6;border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
.switch{text-align:center;font-size:13.5px;color:var(--sub);margin-top:16px}
.switch button{border:0;background:none;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 클릭 반짝임 */
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:15}
.burst i{position:absolute;left:-2px;top:0;width:4px;height:12px;border-radius:4px;background:var(--yel);transform-origin:50% 0;animation:ray .45s ease-out forwards}
@keyframes ray{from{transform:rotate(var(--a)) translateY(6px) scaleY(.3);opacity:1}to{transform:rotate(var(--a)) translateY(26px) scaleY(1);opacity:0}}

/* ㅊ 캐릭터 (데스크톱 전용) */
#buddy{position:fixed;left:0;top:0;width:58px;height:48px;pointer-events:none;z-index:9;opacity:0;transition:opacity .1s;will-change:transform}
#buddy.on{opacity:1}
#buddy .shadow{position:absolute;left:18.5px;top:45px;width:26px;height:6px;border-radius:50%;background:rgba(16,24,40,.14)}
#buddy .bd,#buddy .flip{position:absolute;inset:0}
#buddy .bd{transform-origin:54.2% 99.5%}
#buddy .flip{transform-origin:54.2% 50%}
#buddy img{position:absolute;inset:0;width:100%;height:100%;user-select:none}
#buddy .legL{transform-origin:45.8% 81%}
#buddy .legR{transform-origin:60.4% 79.1%}
#buddy .chieut{transform-origin:10.95% 57.9%}
#buddy .blink-eyes{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
#buddy.waiting .blink-eyes{animation:buddy-blink 3s infinite}
@keyframes buddy-blink{0%,90%,98%,100%{opacity:0}92%,96%{opacity:1}}
@media (max-width:640px),(hover:none){#buddy{display:none}}
/* 캐릭터가 쓰는 학사모: 머리 꼭대기에 끼운다 (몸과 함께 좌우로 뒤집힌다) */
#buddy .hat{position:absolute;left:16px;top:-11px;width:36px;height:27px;transform-origin:50% 90%;transform:rotate(-8deg) scale(0);opacity:0;pointer-events:none}
#buddy.lofty{z-index:20}   /* 채팅창 머리로 뛰어오를 때는 채팅창 위로 */
#buddy.on.docked{opacity:0;transition:none}
#buddy.capped .hat{opacity:1;animation:hat-on .32s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes hat-on{from{transform:rotate(-8deg) translateY(-6px) scale(1.15)}to{transform:rotate(-8deg) translateY(0) scale(1)}}

/* 학사모 AI 도우미 버튼 + 오른쪽 세로 채팅창 */
.cap-bot{position:fixed;right:24px;bottom:24px;z-index:18;width:76px;height:62px;padding:0;border:0;background:none;cursor:pointer;
  filter:drop-shadow(0 6px 10px rgba(16,24,40,.22));transition:transform .36s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.cap-bot svg{width:100%;height:100%;display:block;animation:cap-bob 2.6s ease-in-out infinite}
.cap-bot .tassel{transform-origin:47px 20px;animation:tassel 2.6s ease-in-out infinite}
.cap-bot:hover svg{animation-duration:1.2s}
.cap-bot:focus-visible{outline:3px solid var(--yel);outline-offset:4px;border-radius:16px}
.cap-bot.lift{transform:translateY(-80px)}
/* 학사모 위 말풍선: 늘 떠 있다가 모자가 떠오르면 사라진다 */
.cap-bot .say{position:absolute;right:-6px;bottom:100%;margin-bottom:8px;white-space:nowrap;background:#fff;color:var(--ink);border:1.5px solid var(--ink);
  font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px;transform-origin:80% 120%;animation:say-in .45s cubic-bezier(.3,1.6,.5,1) 1.2s both,say-bob 2.6s ease-in-out 1.65s infinite;transition:opacity .2s}
.cap-bot .say::after{content:"";position:absolute;right:30px;bottom:-6px;width:10px;height:10px;background:#fff;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.cap-bot.lift .say,.cap-bot.gone .say{opacity:0}
@keyframes say-in{from{opacity:0;transform:translateY(6px) scale(.6)}to{opacity:1;transform:none}}
@keyframes say-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cap-bot.gone{opacity:0;transform:translateY(-80px) scale(.6);pointer-events:none}
.cap-bot.taken{transition:none}   /* 캐릭터가 머리에 쓰는 순간 그 자리에서 바로 사라진다 */
@keyframes cap-bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(3deg)}}
@keyframes tassel{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}

.chat{position:fixed;right:24px;bottom:24px;z-index:19;width:380px;height:min(640px,calc(100vh - 48px));display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 64px rgba(16,24,40,.18);overflow:hidden;
  opacity:0;transform:translateX(24px) scale(.98);transform-origin:100% 100%;pointer-events:none;visibility:hidden;transition:opacity .22s,transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s}
.chat.show{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .22s,transform .3s cubic-bezier(.2,.9,.3,1)}
.chat-head{display:flex;align-items:center;gap:10px;padding:16px 16px 14px 18px;border-bottom:1px solid var(--line)}
.chat-ava{position:relative;flex:none;width:58px;height:48px;margin:-4px 0 -4px -6px}
.chat-ava img{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.chat-ava .hat{position:absolute;left:16px;top:-11px;width:36px;height:27px;transform:rotate(-8deg)}
.chat.wait-buddy .chat-ava{visibility:hidden}   /* 캐릭터가 뛰어올라 앉으면 그 모습 그대로 이 아이콘으로 바뀐다 */
.chat-head h2{margin:0;font-size:16px;font-weight:800;color:var(--ink)}
#chatTitle:focus{outline:none}
.chat-head p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.chat-reset{margin-left:auto;flex:none;padding:6px;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;cursor:pointer}
.chat-reset:disabled{opacity:.5;cursor:default}
.chat-close{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--chip);color:var(--sub);font-size:14px;cursor:pointer}

.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-msg{align-self:flex-start;max-width:93%;padding:11px 14px;border-radius:16px 16px 16px 4px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}

.chat-results{display:grid;gap:7px;margin:9px 0 0;padding:0;list-style:none}
.chat-results button{display:block;width:100%;padding:9px 10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.chat-results button:hover{border-color:var(--ink)}
.chat-results small{display:block;margin-top:3px;color:var(--sub);font-size:12px}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:14px;background:var(--chip)}
.chat-form button{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700}
.chat-form :disabled{opacity:.55;cursor:not-allowed}
@media (max-width:640px){
  .cap-bot{right:14px;bottom:14px;width:64px;height:52px}

<script>
// 공개 목록은 서버(tools_apps 중 업로드된 앱)에서만 채운다. 내장 예시 앱은 2026-11-05에 없앴다.
const apps = [];
let appsLoading = true;   // tools.js가 서버 목록을 채운 뒤 false로 바꾼다
let appsLoadFailed = false;

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v)), lerp = (a,b,t) => a+(b-a)*t;
const fmt = d => d.slice(2).replaceAll('-','.');
const stack = (n,top='') => Array.from({length:n},(_,z)=>`<i style="transform:translateZ(${z}px)">${z===n-1?top:''}</i>`).join('');

/* ===== 참쌤 캐릭터 =====

const charLayers = () => Object.entries(CHAR).map(([k,src])=>`<img class="${k}" src="${src}" alt="" draggable="false">`).join('');
// 학사모 (AI 도우미 버튼·채팅창 머리·캐릭터가 쓰는 모자에 함께 쓴다)

const mark = () =>`<span class="mark char" aria-hidden="true">${charLayers()}</span>`;
$('#logo').insertAdjacentHTML('afterbegin', mark());

/* ===== 카드 ===== */

function escapeHtml(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const periodEl = $('#period');
let period = 'week';
const PERIODS = { day:{cur:'d0', prev:'d1', label:'오늘'}, week:{cur:'w0', prev:'w1', label:'최근 7일'}, month:{cur:'m0', prev:'m1', label:'최근 30일'} };
// 기간별 사용 횟수. 서버 기록이 없는 예시 목록은 전체 사용 횟수로 대신한다
const popCount = (a, which) => a.use_periods ? a.use_periods[PERIODS[period][which]] || 0 : which==='cur' ? a.uses : 0;
const gridLoading = $('#gridLoading');
const mobileMQ = matchMedia('(max-width:640px)');
function layout(){
  gridLoading.hidden = !appsLoading;
  if (appsLoading){ updateSubjects([]); $('#total').textContent = '…'; $('#empty').hidden = true; grid.style.height = '0px'; moveKnob(); return; }
  const W = grid.clientWidth;
  const mobile = mobileMQ.matches;
  const gap = mobile ? 12 : 16;
  const cols = mobile ? 1 : clamp(Math.floor((W+gap)/(300+gap)), 2, 5);
  const cw = (W - gap*(cols-1))/cols;
  updateSubjects(apps.filter(baseMatches));
  const shown = apps.filter(matches);
  const shownSet=new Set(shown);
  apps.forEach(a => {
    a.el.classList.toggle('hide', !shownSet.has(a));
    a.el.querySelector('.rank-badge').hidden=true;
    a.el.querySelector('.rank-move').hidden=true;
    a.el.setAttribute('aria-label',`${a.name} 자세히 보기`);
  });
  // 숨긴 카드가 예전(넓은 화면) 자리에 남아 화면 밖으로 삐져나가지 않게 안쪽으로 당겨 둔다
  apps.filter(a => !shownSet.has(a)).forEach(a => {
    a.el.style.width = cw+'px';
    a.el.style.left = Math.min(parseFloat(a.el.style.left)||0, W - cw)+'px';
  });
  $('#empty').hidden = shown.length > 0;
  $('#total').textContent = shown.length;   // 고른 분류·학교급·검색어에 맞는 웹앱 수
  const rows = Math.max(1, Math.ceil(shown.length/cols));
  let ch = 124;
  if (!mobile){
    // 데스크톱은 남은 화면 높이를 채우도록 카드 높이를 맞춘다
    const avail = innerHeight - (grid.getBoundingClientRect().top + scrollY) - 32;
    ch = clamp((avail - gap*(rows-1))/rows, 164, 230);
  }
  // 인기순은 서버가 매긴 전체 순위를 따르고, 순위가 없으면(예시 목록) 사용 횟수로 정렬한다
  // 인기순: 고른 기간(일별·주별·월별)의 사용 횟수로 정렬하고, 바로 앞 같은 길이의 기간과 순위를 비교한다
  periodEl.classList.toggle('show', key==='popular'); periodEl.inert = key!=='popular';
  if (key==='popular') periodEl.style.width = seg.offsetWidth+'px';
  const byCount = which => (x,y)=> popCount(y,which)-popCount(x,which) || y.uses-x.uses || String(x.created).localeCompare(String(y.created));
  const curRank = new Map([...apps].sort(byCount('cur')).map((a,i)=>[a,i+1]));
  const prevRank = new Map([...apps].sort(byCount('prev')).map((a,i)=>[a,i+1]));
  const hasRankHistory = apps.some(a=>popCount(a,'prev')>0);
  const sorted = [...shown].sort((x,y)=> key==='popular' ? byCount('cur')(x,y) : y[key].localeCompare(x[key]));
  sorted.forEach((a,i)=>{
    const r = Math.floor(i/cols), c = i%cols;
    if(key==='popular' && i<3){
      const badge=a.el.querySelector('.rank-badge');
      badge.hidden=false;badge.dataset.rank=String(i+1);badge.textContent=`🏆 ${i+1}등`;
      a.el.setAttribute('aria-label',`인기순 ${i+1}등 · ${a.name} 자세히 보기`);
    }
    // 인기순에서는 어제(직전 기록일)와 비교한 순위 변동을 블록 안에 표시한다
    // 첫 기록일처럼 비교할 이전 순위가 하나도 없으면 모두 NEW가 되므로 표시하지 않는다
    if (key==='popular' && hasRankHistory){
      const move = a.el.querySelector('.rank-move'), isNew = popCount(a,'prev')===0 && popCount(a,'cur')>0;
      const diff = isNew ? null : popCount(a,'cur')===0 && popCount(a,'prev')===0 ? 0 : prevRank.get(a) - curRank.get(a);
      move.hidden = false;
      move.className = `rank-move ${diff===null?'new':diff>0?'up':diff<0?'down':'same'}`;
      move.textContent = diff===null ? 'NEW' : diff>0 ? `▲ ${diff}` : diff<0 ? `▼ ${-diff}` : '–';
      move.setAttribute('aria-label', diff===null ? '새로 순위에 오름' : diff>0 ? `순위 ${diff}계단 상승` : diff<0 ? `순위 ${-diff}계단 하락` : '순위 변동 없음');
    }
    Object.assign(a.el.style, {
      width: cw+'px', height: ch+'px',
      left: c*(cw+gap)+'px', top: r*(ch+gap)+'px',
      transitionDelay: `${i*30}ms,${i*30}ms,0s,0s,0s`
    });
    let cardMeta = '';
    if (key === 'popular') cardMeta = `${PERIODS[period].label} 사용 ${popCount(a,'cur').toLocaleString()}회`;
    if (key === 'updated') cardMeta = `업데이트 ${fmt(a.updated)}`;
    a.el.querySelector('.date').textContent = cardMeta;
  });
  grid.style.height = shown.length ? (rows*ch + (rows-1)*gap) + 'px' : '0px';
  moveKnob();
}

// 스크롤바 때문에 두 폭 사이를 짧은 시간에 오가면(scrollbar-gutter를 지원하지 않는 브라우저) 다시 배치하지 않는다
let prevWidth=-1,widthChangedAt=0;
new ResizeObserver(entries=>{
  const width=entries[0].contentRect.width,now=performance.now();
  if(width===observedWidth)return;
  const flapping=width===prevWidth&&now-widthChangedAt<1000&&Math.abs(width-observedWidth)<=24;
  prevWidth=observedWidth;observedWidth=width;widthChangedAt=now;
  if(!flapping)scheduleLayout();
}).observe(grid);   // 화면 폭이 바뀌는 모든 경우(회전·창 크기·확대)에 다시 배치

    `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${Array.from({length:9},(_,i)=>`<div class="blk" style="aspect-ratio:1;${i%4==0?`background:${a.color}`:''}"></div>`).join('')}</div><div class="blk" style="height:40px;background:${a.color}"></div>`,
    `${[80,55,95,40,70].map(w=>`<div style="display:flex;gap:8px;align-items:center"><div class="blk" style="width:26px;height:26px;border-radius:50%;flex:none"></div><div class="blk" style="height:12px;width:${w}%;background:${a.color}aa"></div></div>`).join('')}<div class="blk" style="flex:1"></div>`
  ];

function openApp(id){

// 컴퓨터에서는 Ctrl+휠 없이도 스크린샷을 넘길 수 있게 좌우 버튼을 둔다
function addShotNav(row){
  const wrap = document.createElement('div'); wrap.className = 'shots-wrap';
  row.before(wrap); wrap.append(row);
  const button = (dir, label, text) => { const b = document.createElement('button'); b.type = 'button'; b.className = `shot-nav ${dir}`; b.setAttribute('aria-label', label); b.textContent = text; wrap.append(b); return b; };
  const prev = button('prev','이전 스크린샷','‹'), next = button('next','다음 스크린샷','›');
  const step = () => (row.querySelector(':scope > *')?.offsetWidth || 240) + 12;
  const sync = () => { prev.disabled = row.scrollLeft <= 4; next.disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4; };
  prev.addEventListener('click', ()=>row.scrollBy({left:-step(), behavior:'smooth'}));
  next.addEventListener('click', ()=>row.scrollBy({left:step(), behavior:'smooth'}));
  row.addEventListener('scroll', sync, {passive:true});
  row.querySelectorAll('img').forEach(img=>img.addEventListener('load', sync, {once:true}));
  requestAnimationFrame(sync);
}
// 앱스토어 정보 줄처럼: 제목 · 값 (교과 · 카테고리 · 개발자 · 적용 학년)
function factsRow(app){
  const subjects = app.subjects || [];
  const subjectText = subjects.length > 2 ? `${subjects.slice(0,2).join('·')} 외 ${subjects.length-2}` : subjects.join('·');
  const cell = (label, value, title=value) => `<div><span>${label}</span><b title="${escapeHtml(title)}">${escapeHtml(value || '—')}</b></div>`;
  return `<div class="facts">${cell('교과',subjectText,subjects.join(', '))}${cell('카테고리',app.cat)}${cell('개발자',app.author_name||'참쌤스쿨')}${cell('적용 학년',app.grade)}</div>`;
}
// 유튜브·비메오 주소는 화면 안에서 재생하고, 그 밖의 영상 주소는 새 창 링크로 연다
function videoEmbed(url){
  try {
    const u = new URL(url); let id = '';
    if (/(^|\.)youtube\.com$/.test(u.hostname)) id = u.pathname === '/watch' ? u.searchParams.get('v') : (u.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/)||[])[2];
    else if (u.hostname === 'youtu.be') id = u.pathname.slice(1);
    if (id && /^[\w-]{6,20}$/.test(id)) return `https://www.youtube-nocookie.com/embed/${id}`;
    if (/(^|\.)vimeo\.com$/.test(u.hostname)){ const v = u.pathname.split('/').filter(Boolean).pop(); if (/^\d+$/.test(v)) return `https://player.vimeo.com/video/${v}`; }
  } catch {}
  return '';
}
function videoSection(app){
  if (!app.video_url) return '';
  const embed = videoEmbed(app.video_url);
  return `<section class="detail-sec"><h4>소개 영상</h4>${embed
    ? `<div class="video-box"><iframe src="${escapeHtml(embed)}" title="${escapeHtml(app.name)} 소개 영상" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
    : `<a class="btn line app-link" href="${escapeHtml(app.video_url)}" target="_blank" rel="noopener noreferrer">소개 영상 보기 ↗</a>`}</section>`;
}

let toastTimer;
function toast(msg){

/* ===== 커서를 따라다니는 참쌤 캐릭터 (마우스가 있는 넓은 화면에서만) =====
   몸은 가는 방향으로 좌우 반전되지만, 머리의 ㅊ 레이어만 다시 한 번 뒤집어 글자가 거울상이 되지 않게 한다. */
const Buddy = (()=>{
  const mq = matchMedia('(hover:hover) and (pointer:fine) and (min-width:641px)');
  const api = { active:false, cheer(){} };
  let el, bd, flip, legL, legR, chieut, sh, raf, s;

  function onMove(e){
    const dx = e.clientX - s.mx;
    if (Math.abs(dx) > 2) s.side = dx > 0 ? 1 : -1;      // 커서가 가는 방향의 뒤쪽에 선다
    s.mx = e.clientX; s.my = e.clientY;
    s.hasMouse = true;
    const hoveredCard = e.target.closest('.card:not(.hide)');
    if (hoveredCard !== s.card){ s.card = hoveredCard; s.cardSince = performance.now(); }
  }

  // 튀어나오는 크기 변화: 0에서 살짝 크게 지나쳤다가 제자리로
  const popOut = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };

  function tick(t){
    // 페이지를 열고 1초 동안은 숨어 있다가 왼쪽 위에서 '뽕!' 하고 나타난다
    if (t < s.bornAt){ raf = requestAnimationFrame(tick); return; }
    if (!s.born){ s.born = true; el.classList.add('on'); burst(s.x, s.y - 24); }
    const age = t - s.bornAt;
    const popS = age < 450 ? popOut(age/450) : 1;
    const ready = s.hasMouse && age > 350;          // 나타난 모습을 잠깐 보여준 뒤 커서로 출발
    s.sideS = lerp(s.sideS, s.side, .06);
    // 커서를 아직 모르면 처음 자리(왼쪽 위)에 서 있다가, 커서가 보이면 그쪽으로 뛰어간다
    // 같은 카드에 0.5초 머물면 카드 오른쪽 위 모서리로 점프해서 걸터앉는다. 그전에는 커서를 따라간다.
    if (s.card && (!s.card.isConnected || !s.card.matches(':hover') || s.card.classList.contains('hide'))) s.card = null;
    // 학사모를 누르면 떠오른 모자 바로 밑으로 달려가 폴짝 뛰어 머리를 끼운다 (그동안 카드·커서는 무시)
    const cap = s.cap;
    if (cap && cap.phase === 'go'){
      const far = Math.hypot(cap.x-s.x, cap.y-s.y);
      if ((far < 6 && Math.hypot(s.vx,s.vy) < 2.5) || t-cap.t0 > 3500){ cap.phase = 'jump'; s.x = cap.x; s.y = cap.y; s.vx = s.vy = 0; s.jv = -6; s.face = -1; }
    } else if (cap && cap.phase === 'jump' && s.jv >= 0){   // 가장 높이 뛰었을 때 모자가 머리에 쏙
      s.cap = null; el.classList.add('capped','lofty'); s.cheer = t; cap.done();   // 이때부터 채팅창보다 위에 그려 가려지지 않게
    }
    const card = ready && !s.cap && !s.dock && s.card && t-s.cardSince >= 500 ? s.card : null;
    if (s.perch && s.perch.card !== card){ s.perch = null; s.vx = s.vy = 0; if (s.jy === 0) s.jv = -4; }   // 카드를 벗어나면 폴짝 내려와 다시 따라간다
    const anchor = card?.getBoundingClientRect();
    const seatX = anchor ? clamp(anchor.right-30,32,innerWidth-32) : 0, seatY = anchor ? Math.max(52,anchor.top+14) : 0;
    // 모서리에서 멀면 먼저 달려가고, 가까워지면(200px 안) 점프한다
    if (card && !s.perch && Math.hypot(seatX-s.x, seatY-s.y) <= 200){ s.perch = {card, fx:s.x, fy:s.y, t0:t, sat:false}; s.face = Math.sign(seatX - s.x) || s.face; }
    const perch = s.perch;
    const dock = s.dock;
    if (dock){
      // 모자를 쓴 채 채팅창 머리의 아이콘 자리로 크게 뛰어올라 앉는다 → 앉으면 같은 모습의 아이콘과 바꿔치기
      const p = Math.min(1, (t-dock.t0)/620), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      if (p < 1){ s.x = lerp(dock.fx, dock.x, e); s.y = lerp(dock.fy, dock.y, e) - 70*4*p*(1-p); }
      else {
        s.x = dock.x; s.y = dock.y;
        if (!dock.in){ dock.in = true; s.faceS = 1; s.amp = 0; s.cheer = 0; s.squash = 0; s.lean = 0; el.classList.add('docked'); dock.done(); }
      }
      s.vx = s.vy = 0; s.jy = 0; s.jv = 0;
    }
    else if (s.cap?.phase === 'jump'){ s.vx = s.vy = 0; }
    else if (perch){
      // 포물선으로 뛰어올라 모서리에 앉는다. 앉은 뒤에는 방향을 고정해 좌우로 돌아보지 않는다.
      const p = Math.min(1, (t-perch.t0)/480), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      if (p < 1){
        const h = Math.min(90, 40 + Math.abs(seatY-perch.fy)*.2);
        s.x = lerp(perch.fx, seatX, e); s.y = lerp(perch.fy, seatY, e) - h*4*p*(1-p);
      } else {
        if (!perch.sat){ perch.sat = true; s.squash = .14; }
        s.x = seatX; s.y = seatY;
      }
      s.vx = s.vy = 0;
    } else {
      const tx = s.cap ? s.cap.x : card ? seatX : ready ? s.mx-s.sideS*30 : s.x, ty = s.cap ? s.cap.y : card ? seatY : ready ? s.my+26 : s.y;
      const dx = tx - s.x, dy = ty - s.y, dist = Math.hypot(dx,dy);
      // 멀수록 강하게 끌려와서 커서가 빠르면 빨리 따라온다
      const k = .03 + Math.min(dist,700)/700*.11;
      s.vx = (s.vx + dx*k)*.76; s.vy = (s.vy + dy*k)*.76;
      // 순간이동처럼 보이지 않게 최고 속도를 두어, 멀리서는 달려오는 모습이 보이게 한다
      const v = Math.hypot(s.vx, s.vy), MAXV = 16;
      if (v > MAXV){ s.vx *= MAXV/v; s.vy *= MAXV/v; }
      s.x += s.vx; s.y += s.vy;
    }
    const speed = Math.hypot(s.vx, s.vy);
    el.classList.toggle('waiting', !!perch?.sat && !s.cheer);

    // 방향 전환: 움직이면 진행 방향, 멈추면 커서 쪽. 폭이 줄었다 늘며 몸을 돌린다 (카드 위에서는 고정)
    if (perch || dock) {}
    else if (Math.abs(s.vx) > .6) s.face = Math.sign(s.vx);
    else if (s.hasMouse && Math.abs(s.mx - s.x) > 30) s.face = Math.sign(s.mx - s.x);
    s.faceS = lerp(s.faceS, s.face, .22);

    // 걷기: 다리를 번갈아 앞뒤로, 몸은 통통 튀며 살짝 뒤뚱
    s.amp = lerp(s.amp, clamp(speed/4, 0, 1), .18);
    s.phase += .15 + Math.min(speed,30)*.09;
    const sw = Math.sin(s.phase);
    const bob = -Math.abs(sw)*3*s.amp;
    const rock = sw*3*s.amp;
    s.lean = lerp(s.lean, clamp(s.vx*1.1, -10, 10), .15);

    // 감속하면 살짝 눌렸다 펴지고, 점프 후 착지할 때도 눌린다
    s.squash = lerp(s.squash, clamp((s.prev-speed)*.06, 0, .12), .3); s.prev = speed;
    if (s.jv || s.jy < 0){ s.jv += .55; s.jy += s.jv; if (s.jy >= 0){ s.jy = 0; s.jv = 0; s.squash = .16; } }

    // 클릭하면 신나서 몸을 흔들고 다리를 동동
    let wiggle = 0, pop = 0, kick = 0;
    if (s.cheer){
      const c = t - s.cheer;
      if (c < 700){ const f = 1 - c/700; wiggle = Math.sin(c/38)*9*f; pop = .08*f; kick = Math.sin(c/45)*30*f; } else s.cheer = 0;
    }

    const breathe = Math.sin(t/420)*.025*(1-s.amp);
    const sy = 1 - s.squash + breathe + pop + (s.jy < 0 ? .05 : 0), sx = 1 + s.squash - breathe*.6 + pop*.5;
    let legA = sw*30*s.amp + kick, legB = -legA, sitDrop = 0;
    if ((perch && !perch.sat) || (dock && !dock.in)){ legA = -22; legB = 22; }                                   // 점프 중에는 다리를 모은다
    else if (perch){ legA = Math.sin(t/380)*14 + kick; legB = Math.sin(t/380+1.3)*14 - kick; sitDrop = 2; }   // 걸터앉아 다리를 달랑달랑

    el.style.transform = `translate3d(${s.x-31.4}px,${s.y-47.8}px,0)`;
    bd.style.transform = `translateY(${bob+s.jy+sitDrop}px) rotate(${s.lean + rock + wiggle}deg) scale(${sx*popS},${sy*popS*(perch?.sat?.97:1)})`;
    flip.style.transform = `scaleX(${s.faceS})`;
    chieut.style.transform = `scaleX(${s.faceS < 0 ? -1 : 1})`;
    legL.style.transform = `rotate(${legA}deg)`;
    legR.style.transform = `rotate(${legB}deg)`;
    sh.style.transform = `scale(${(1 + s.jy/50 - s.amp*.08)*popS})`;
    sh.style.opacity = perch || dock ? 0 : 1 + s.jy/70;   // 공중·카드 위에서는 바닥 그림자를 숨긴다
    raf = requestAnimationFrame(tick);
  }

  function mount(){
    if (api.active) return;
    el = document.createElement('div'); el.id = 'buddy'; el.setAttribute('aria-hidden','true');
    el.innerHTML = `<div class="shadow"></div><div class="bd"><div class="flip">${charLayers()}<svg class="blink-eyes" viewBox="0 0 240 198" aria-hidden="true"><ellipse cx="116" cy="114" rx="9" ry="10" fill="#f8f2e8"/><ellipse cx="152" cy="106" rx="9" ry="10" fill="#f8f2e8"/><path d="M110 115q6 3 12-1M146 107q6 3 12-1" fill="none" stroke="#292722" stroke-width="3" stroke-linecap="round"/></svg>${CAP_SVG('hat')}</div></div>`;
    document.body.appendChild(el);
    [bd, flip, legL, legR, chieut, sh] = ['.bd','.flip','.legL','.legR','.chieut','.shadow'].map(q=>el.querySelector(q));
    // 처음엔 화면 왼쪽 위(로고 아래)에서 등장한다
    s = { mx:0, my:0, hasMouse:false, born:false, bornAt:performance.now()+1000, x:56, y:118, vx:0, vy:0, side:1, sideS:1, face:1, faceS:1, lean:0,
          phase:0, amp:0, squash:0, prev:0, jy:0, jv:0, cheer:0 };
    addEventListener('mousemove', onMove);
    raf = requestAnimationFrame(tick);
    api.active = true;
  }
  function unmount(){
    if (!api.active) return;
    cancelAnimationFrame(raf); removeEventListener('mousemove', onMove); el.remove();
    const hadCap = el.classList.contains('capped') || !!s.cap;
    api.active = false;
    if (hadCap) api.onCapLost?.();   // 모자를 쓴 채(또는 쓰러 가다가) 캐릭터가 꺼지면 알려 준다
  }
  // 학사모 쓰기: (x,y)는 캐릭터가 서야 할 발끝 위치. 머리에 끼우면 done()을 부른다.
  api.wearCap = (x, y, done) => {
    if (!api.active) return false;
    s.perch = null; s.card = null;
    s.cap = { x, y, phase:'go', t0:performance.now(), done };
    return true;
  };
  // 채팅창 머리의 아이콘(rect) 자리로 뛰어올라 앉는다. 앉으면 done()으로 아이콘을 보여 주고 캐릭터는 숨는다.
  api.dock = (rect, done) => {
    if (!api.active) return false;
    s.perch = null; s.card = null;
    s.dock = { x:rect.left+31.4, y:rect.top+47.8, fx:s.x, fy:s.y+s.jy, t0:performance.now(), in:false, done };
    s.face = 1; el.classList.add('lofty');
    return true;
  };
  // 채팅창을 닫으면 아이콘 자리에서 다시 나타나 폴짝 뛰어내린다
  api.undock = () => {
    if (!api.active || !s.dock) return;
    s.dock = null; el.classList.remove('docked'); s.jy = 0; s.jv = -5;
  };
  api.takeOffCap = () => {
    if (!api.active) return;
    s.cap = null; el.classList.remove('capped');
    const me = el; setTimeout(() => { if (!el.classList.contains('capped')) me.classList.remove('lofty'); }, 450);   // 뛰어내린 뒤 원래 층으로
  };
  api.cheer = () => {
    if (!api.active) return;
    s.cheer = performance.now();
    if (s.jy === 0) s.jv = -5.5;
  };
  // 오른쪽 위 토글: 켜고 끈 상태는 이 브라우저에 기억해 둔다
  let enabled = true;
  try { enabled = localStorage.getItem('buddy') !== 'off'; } catch(e) {}
  const toggle = $('#buddyToggle');
  const sync = () => { toggle.setAttribute('aria-pressed', enabled); (mq.matches && enabled) ? mount() : unmount(); };
  toggle.addEventListener('click', () => {
    enabled = !enabled;
    try { localStorage.setItem('buddy', enabled ? 'on' : 'off'); } catch(e) {}
    sync();
  });
  mq.addEventListener('change', sync);
  sync();
  return api;
})();

// 학사모 웹앱 도우미: 캐릭터가 모자를 쓴 뒤 채팅창이 열린다. 캐릭터가 꺼져 있으면 바로 연다.
const Chat = (()=>{
  const btn = $('#capBot'), panel = $('#chat'), title = $('#chatTitle');
  const log = $('#chatLog'), input = $('#chatQuestion'), reset = $('#chatReset');
  const greeting = log.firstElementChild;
  const conversation = AppRecommendations.createConversation();
  btn.insertAdjacentHTML('afterbegin', CAP_SVG());
  panel.querySelector('.chat-cap').outerHTML = `<span class="chat-ava" aria-hidden="true">${charLayers()}${CAP_SVG('hat')}</span>`;
  const ava = panel.querySelector('.chat-ava');
  let open = false, busy = false;
  function show(){
    if (open) return;
    const viaBuddy = busy && Buddy.active;
    busy = false; open = true;
    panel.classList.toggle('wait-buddy', viaBuddy);
    if (viaBuddy) setTimeout(() => {            // 채팅창이 다 열린 뒤 모자 쓴 캐릭터가 아이콘 자리로 올라간다
      if (!open || !panel.classList.contains('wait-buddy')) return;
      if (!Buddy.dock(ava.getBoundingClientRect(), () => panel.classList.remove('wait-buddy'))) panel.classList.remove('wait-buddy');
    }, 340);
    btn.classList.add('gone');
    panel.classList.add('show'); panel.setAttribute('aria-hidden','false'); btn.setAttribute('aria-expanded','true');
    title.focus({preventScroll:true});
  }
  function openChat(){
    if (open || busy) return;
    if (!Buddy.active) return show();
    busy = true;
    btn.classList.add('lift');
    setTimeout(() => {                       // 모자가 다 떠오른 뒤 그 밑으로 출발
      const r = btn.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      if (!busy) return;
      // 모자를 다 쓰고 착지한 뒤에 채팅창을 연다 → 열리고 나서 아이콘 자리로 올라간다
      // 머리에 쓰는 순간 위에 떠 있던 모자는 바로 없앤다(모자는 캐릭터와 함께 움직인다)
      if (!Buddy.wearCap(cx - 2.6, cy + 75, () => { btn.classList.add('gone','taken'); setTimeout(show, 450); })) show();
    }, 360);
  }
  function closeChat(restoreFocus = true){
    if (!open) return;
    open = false;
    panel.classList.remove('show'); panel.setAttribute('aria-hidden','true'); btn.setAttribute('aria-expanded','false');
    Buddy.undock(); Buddy.takeOffCap();
    panel.classList.remove('wait-buddy');
    btn.classList.remove('gone','lift','taken');
    if (restoreFocus) btn.focus({preventScroll:true});
  }
  function addMessage(message, matches = [], question = false){
    const bubble = document.createElement('div');
    bubble.className = question ? 'chat-msg question' : 'chat-msg';
    const text = document.createElement('p');
    text.textContent = message;
    bubble.append(text);
    if (matches.length) {
      const results = document.createElement('ul');
      results.className = 'chat-results';
      for (const { app, labels } of matches) {
        const item = document.createElement('li');
        const detail = document.createElement('button');
        detail.type = 'button';
        detail.dataset.recommendedApp = app.id;
        const name = document.createElement('strong');
        name.textContent = app.name;
        const info = document.createElement('small');
        info.textContent = [app.grade, labels.slice(0, 3).join(', ')].filter(Boolean).join(' · ');
        const summary = document.createElement('small');
        summary.textContent = app.short || '';
        detail.append(name, info, summary);
        item.append(detail);
        results.append(item);
      }
      bubble.append(results);
    }
    log.append(bubble);
    log.scrollTop = log.scrollHeight;
    reset.disabled = false;
  }
  Buddy.onCapLost = () => { if (busy) show(); panel.classList.remove('wait-buddy'); };
  btn.addEventListener('click', () => open ? closeChat() : openChat());
  $('#chatClose').addEventListener('click', () => closeChat());
  reset.addEventListener('click', () => {
    conversation.reset();
    log.replaceChildren(greeting);
    input.value = '';
    input.focus();
    reset.disabled = true;
  });
  log.addEventListener('click', e => {
    const detail = e.target.closest('[data-recommended-app]');
    if (!detail) return;
    const id = detail.dataset.recommendedApp;
    if (!apps.some(app => String(app.id) === id)) {
      addMessage('이 웹앱은 현재 공개 목록에 없어요. 다시 추천을 받아 주세요.');
      return;
    }
    closeChat(false);
    openApp(id);
    appSheet.querySelector('.x').focus({preventScroll:true});
  });
  $('#chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    if (appsLoading || appsLoadFailed || !apps.length) {
      addMessage(appsLoading ? '공개 웹앱 목록을 불러오고 있어요. 잠시 후 다시 보내 주세요.'
        : appsLoadFailed ? '목록을 불러오지 못했어요. 연결을 확인한 뒤 새로고침해 주세요.'
        : '현재 추천할 수 있는 공개 웹앱이 없어요.');
      return;
    }
    input.value = '';
    addMessage(question, [], true);
    const { message, matches } = conversation.ask(question, apps);
    addMessage(message, matches);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChat(); });
  return { open: openChat, close: closeChat };
})();
</script>
<script src="/tools.js"></script>
